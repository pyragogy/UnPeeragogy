# Unpeeragogy nginx — security headers + static site serving
# Used by Dockerfile.web

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────
    # HSTS (Strict-Transport-Security): tells browsers to always use HTTPS
    # Remove/include based on your TLS termination setup
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Referrer policy: don't leak path from HTTPS
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable XSS filter (deprecated but harmless signal)
    add_header X-XSS-Protection "0" always;

    # ── Gzip ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # ── Static Assets ────────────────────────────────────
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Immutable cache for hashed assets (_astro/*)
    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Pagefind index (rebuilt at deploy, cacheable but not immutable)
    location /pagefind/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Sitemap + feeds
    location ~* \.(xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # ── Error Pages ──────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}