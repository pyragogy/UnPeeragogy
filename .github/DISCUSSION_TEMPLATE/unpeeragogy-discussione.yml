title: "💬 Unpeeragogy — Discussione"
labels: ["discussione"]
body:
  - type: markdown
    attributes:
      value: |
        ## Discussione ancorata alla Realtà Operativa

        Stai aprendo una discussione su una entry della **colonna realtà** di Unpeeragogy.

        Niente teoria. Solo esperienze, fallimenti, verità scomode.

  - type: input
    id: slug
    attributes:
      label: Entry (slug)
      description: Lo slug della pagina su cui vuoi discutere
      placeholder: es. carrying, stasis, isolation
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Titolo della discussione
      description: Un titolo chiaro per la discussione
      placeholder: "[Titolo entry] — Il tuo punto di vista"
    validations:
      required: true

  - type: textarea
    id: corpo
    attributes:
      label: La tua esperienza
      description: Cosa hai vissuto che conferma, contraddice o estende questa entry?
      placeholder: |
        Il Failure Vector descritto qui...
        - L'hai visto succedere?
        - Hai un esempio concreto?
        - Cosa hai fatto per uscirne?
        - Cosa non ha funzionato?
    validations:
      required: true

  - type: dropdown
    id: accordo
    attributes:
      label: Posizione
      description: Cosa pensi di questa analisi?
      options:
        - Conferma — l'ho vissuto
        - Estende — manca un pezzo
        - Contraddice — la mia esperienza è diversa
        - Domanda — non capisco un punto
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impatto
      description: Cosa dovrebbe succedere dopo?
      options:
        - label: "Il tension_index di questa entry va aggiornato"
        - label: "Manca un Failure Vector che andrebbe aggiunto"
        - label: "L'Agente Perturbatore potrebbe essere più affilato"

  - type: markdown
    attributes:
      value: |
        ---
        *Questa discussione alimenta l'evoluzione del progetto. Grazie.*