title: "💬 Unpeeragogy — Discussion"
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        ## Discussion Anchored to Operational Reality

        You're opening a discussion about an entry in the **reality column** of Unpeeragogy.

        No theory. Just experiences, failures, uncomfortable truths.

  - type: input
    id: slug
    attributes:
      label: Entry (slug)
      description: The slug of the page you want to discuss
      placeholder: e.g. carrying, stasis, isolation
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Discussion title
      description: A clear title for the discussion
      placeholder: "[Entry title] — Your perspective"
    validations:
      required: true

  - type: textarea
    id: corpo
    attributes:
      label: Your experience
      description: What have you experienced that confirms, contradicts, or extends this entry?
      placeholder: |
        The Failure Vector described here...
        - Have you seen it happen?
        - Do you have a concrete example?
        - What did you do about it?
        - What didn't work?
    validations:
      required: true

  - type: dropdown
    id: accordo
    attributes:
      label: Position
      description: What do you think of this analysis?
      options:
        - Confirms — I've lived through it
        - Extends — something is missing
        - Contradicts — my experience differs
        - Question — I don't understand a point
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: What should happen next?
      options:
        - label: "This entry's tension_index should be updated"
        - label: "A Failure Vector is missing and should be added"
        - label: "The Perturbator could be sharper on this one"

  - type: markdown
    attributes:
      value: |
        ---
        *This discussion feeds the evolution of the project. Thank you.*