name: Verify Coolify Token
on: workflow_dispatch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Test Coolify API with existing token
        run: |
          HTTP_CODE=$(curl -s -o /tmp/coolify-response.json -w "%{http_code}" \
            "https://console.pyragogy.org/api/v1/projects" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "TOKEN_OK=true"
            echo "Projects found:" 
            grep -o '"name":"[^"]*"' /tmp/coolify-response.json | head -10
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "TOKEN_OK=false"
            echo "Error: Unauthenticated - token is invalid"
            cat /tmp/coolify-response.json
          else
            echo "TOKEN_OK=false"
            echo "Unexpected HTTP code: $HTTP_CODE"
            cat /tmp/coolify-response.json
          fi

      - name: Test with UUIDs
        run: |
          echo "Testing with web UUID..."
          HTTP_CODE_WEB=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://console.pyragogy.org/api/v1/deploy?uuid=${{ secrets.COOLIFY_WEB_UUID }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "Web deploy HTTP: $HTTP_CODE_WEB"

          echo "Testing with MCP UUID..."
          HTTP_CODE_MCP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://console.pyragogy.org/api/v1/deploy?uuid=${{ secrets.COOLIFY_MCP_UUID }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "MCP deploy HTTP: $HTTP_CODE_MCP"