name: Auto-label field reports

on:
  discussion:
    types: [created]

permissions:
  discussions: write
  issues: read

jobs:
  label-field-reports:
    runs-on: ubuntu-latest
    if: github.event.discussion.category.name == 'Field reports'
    steps:
      - name: Add field-reports label
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labelResult = await github.graphql(
              `query getLabel($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  label(name: "field-reports") { id }
                }
              }`,
              { owner, repo }
            );

            const labelId = labelResult.repository?.label?.id;
            if (!labelId) {
              core.setFailed('Repository label "field-reports" was not found.');
              return;
            }

            const discussionId = context.payload.discussion?.node_id;
            if (!discussionId) {
              core.setFailed('Discussion node_id is missing from the event payload.');
              return;
            }

            await github.graphql(
              `mutation addLabel($input: AddLabelsToLabelableInput!) {
                addLabelsToLabelable(input: $input) { clientMutationId }
              }`,
              {
                input: {
                  labelableId: discussionId,
                  labelIds: [labelId]
                }
              }
            );
