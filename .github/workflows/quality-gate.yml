name: Research Integrity & Build Gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Epistemic integrity gate
        run: npm run check:integrity

      - name: Build public site
        run: npm run build

      - name: Install MCP dependencies
        working-directory: packages/mcp-server
        run: npm ci

      - name: Type-check and build MCP server
        working-directory: packages/mcp-server
        run: npm run build
