name: Final Maintenance Pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Astro 7 Content Layer migration completed before this pass.
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install and repair site dependencies
        run: |
          npm ci
          # Hibernation target: current patched Astro line plus Tailwind through
          # PostCSS (avoids @tailwindcss/vite/Rolldown resolver incompatibility).
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies.astro="^7.3.5"; p.dependencies["@astrojs/mdx"]="^8.0.2"; delete p.dependencies["@tailwindcss/vite"]; p.devDependencies["@tailwindcss/postcss"]="^4.3.3"; p.devDependencies["@tailwindcss/typography"]="^0.5.20"; p.devDependencies.postcss="^8.5.6"; p.overrides={...(p.overrides||{}),esbuild:"0.28.2",sharp:"0.35.4"}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+String.fromCharCode(10))'
          node -e 'const fs=require("fs"); let s=fs.readFileSync("astro.config.mjs","utf8"); s=s.replace(`import tailwindcss from "@tailwindcss/vite";\\n`,""); s=s.replace(`    plugins: [tailwindcss()],\\n`,""); fs.writeFileSync("astro.config.mjs",s)'
          cat > postcss.config.mjs <<'EOF'
          export default {
            plugins: {
              "@tailwindcss/postcss": {},
            },
          };
          EOF
          npm install
          npm audit fix || true
          npm audit --json > .maintenance-root-audit.json || true

      - name: Install and repair MCP dependencies
        working-directory: packages/mcp-server
        run: |
          npm ci
          npm audit fix || true
          npm audit --json > ../../.maintenance-mcp-audit.json || true

      - name: Migrate historical corpus
        run: node scripts/migrate-legacy-corpus.mjs

      - name: Render maintenance report
        run: node scripts/render-maintenance-report.mjs

      - name: Validate site and epistemic integrity
        run: npm run build
        env:
          NODE_ENV: production

      - name: Validate MCP
        working-directory: packages/mcp-server
        run: npm run build

      - name: Enforce dependency security gate
        run: |
          npm audit --audit-level=high
          (cd packages/mcp-server && npm audit --audit-level=high)

      - name: Remove transient audit JSON
        run: rm -f .maintenance-root-audit.json .maintenance-mcp-audit.json

      - name: Commit maintenance result
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
            exit 0
          fi
          git config user.name "unpeeragogy-bot"
          git config user.email "bot@unpeeragogy.pyragogy.org"
          git commit -m "chore: complete repository maintenance and corpus migration"
          git pull --rebase origin main
          git push
