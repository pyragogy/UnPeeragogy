services:
  mcp:
    build:
      context: https://github.com/pyragogy/unpeeragogy.git
      dockerfile: packages/mcp-server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MCP_FRICTION_MODE=soft
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`mcp.unpeeragogy.pyragogy.org`)"
      - "traefik.http.routers.mcp.entrypoints=https"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=3001"