# UnPeeragogy — local Docker Compose
# Starts the static site and the MCP server.
#
# Security headers are served by nginx via nginx.conf.
#
# Usage:
#   MCP_AUTH_TOKEN='<strong-random-token>' docker compose up -d
#   docker compose up -d mcp
#   docker compose up -d web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - mcp

  mcp:
    build:
      context: ./packages/mcp-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Refuse to start Compose without an explicit token. Never ship a known default.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      - MCP_FRICTION_MODE=${MCP_FRICTION_MODE:-soft}
      - CONTENT_ROOT=/app/content
      - PORT=3001
    volumes:
      - ./src/content:/app/content:ro
    restart: unless-stopped
