# Human Review Ledger — UnPeeragogy
# This file records every epistemic decision made by human reviewers
# (Gate A) on evidence candidates proposed by the automated pipeline.
#
# The automation CAN:
#   - create a PENDING entry
#   - add candidate metadata
#   - link Engine output
#
# The automation CANNOT set:
#   - ACCEPTED | REJECTED | REVISE | NEEDS_EVIDENCE | CONTESTED
#   (these require explicit human action)
#
# Human reviewer (authorized): Fabrizio / repository maintainer
#
# GATES:
#   Gate A (this ledger):   Epistemic validation — evidence may enter validated KB
#   Gate B (vault commit):  Publication — mutation of public vault content
#   Gate A ≠ Gate B
#
# STATES:
#   PENDING         — Awaiting human review
#   ACCEPTED        — Human validated; may be promoted to human_validated
#   REJECTED        — Human rejected; remains auditable (engine_passed + human_rejected)
#   REVISE          — Needs revision before re-review
#   NEEDS_EVIDENCE  — Requires additional supporting evidence
#   CONTESTED       — Disagreement recorded; excluded from default retrieval
#                     but preserved for audit/counterevidence/falsification

ledger:
  - review_id: "REV-001"
    candidate_id: "CAN-001"
    acquisition_channel: "practitioner"
    processing_status: "CANDIDATE"
    target_node: "assessment"
    proposed_valence: "complicating"
    source_description: "assessment — Wikibooks ha rifiutato il progetto di traduzione italiana di Peeragogy perché non riconosceva un manuale di peer learning"
    source_url: "https://github.com/pyragogy/UnPeeragogy/discussions/7"
    engine_output_ref: null
    human_status: "ACCEPTED"
    reviewer: "Fabrizio"
    decision_timestamp: "2026-09-28T12:59:00Z"
    rationale: "First-person practitioner account corroborated by the contemporaneous Wikibooks deletion discussion. The case is accepted as valid evidence for further epistemic use; interpretation and vault-level effects remain subject to separate editorial review."
    resulting_action: "human_validated — accepted for epistemic use; vault mutation requires separate Gate B decision."

